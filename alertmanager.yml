# Alertmanager configuration: defines routing intervals and Discord webhook integration for critical alert notifications
route:
  receiver: 'discord_alert'
  group_wait: 1s
  group_interval: 10s
  repeat_interval: 1m

receivers:
  - name: 'discord_alert'
    discord_configs:
      - webhook_url: 'YOUR_DISCORD_WEBHOOK_URL_HERE'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] - {{ .GroupLabels.alertname }}'
        message: >
          {{ range .Alerts }}
          **Alert:** {{ .Annotations.summary }}
          **Description:** {{ .Annotations.description }}
          **Severity:** {{ .Labels.severity }}
          ---
          {{ end }}
